{% extends 'base.html' %}{% block title %}修改密码{% endblock %}{% block crumb %}修改密码{% endblock %}{% block content %}<div class="page-heading"><div><h1>修改密码</h1><p>建议定期修改密码；修改后，其他设备上的登录会话将失效。</p></div></div><section class="panel narrow"><form id="password-form" class="stack-form"><label>当前密码<input type="password" name="old_password" required autocomplete="current-password"></label><label>新密码<input type="password" name="new_password" required minlength="12" maxlength="128" autocomplete="new-password"><small class="hint">12—128 位，请使用与当前密码不同的密码。</small></label><label>确认新密码<input type="password" name="confirm_password" required autocomplete="new-password"></label><div class="form-error" hidden role="alert" tabindex="-1"></div><button class="btn button primary" type="submit">保存新密码</button></form></section>{% endblock %}
